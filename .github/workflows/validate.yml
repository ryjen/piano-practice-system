name: Reference core validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test deterministic core (stdlib)
        run: |
          python3 --version
          python3 -m unittest discover -s tests -v
      - name: Check reference examples
        run: |
          python3 -m piano_practice.cli plan --date 2026-11-10 > /tmp/piano-plan.json
          python3 -m piano_practice.cli assess examples/midi-takes/pulse-quarter-pass.json > /tmp/piano-assessment.json
          python3 -c 'import json; assert json.load(open("/tmp/piano-assessment.json"))["pass"] is True'
