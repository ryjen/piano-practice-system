[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-practice-system"
version = "0.1.0"
description = "Technique-first, deterministic local piano practice core"
requires-python = ">=3.11"

[project.optional-dependencies]
midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]

[project.scripts]
pianoctl = "piano_practice.cli:main"

[tool.setuptools.packages.find]
include = ["piano_practice*"]
