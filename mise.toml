# Nix pins Python; mise is a thin interface to the same environment.
[tasks.test]
description = "Run standard-library unit tests within the pinned Nix development shell"
run = "nix develop --command python -m unittest discover -s tests -v"

[tasks.check]
description = "Run pinned Nix tests and deterministic CLI smoke checks"
run = "nix flake check --no-write-lock-file --print-build-logs"
